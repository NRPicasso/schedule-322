<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Расписание 322</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="top"></div>
  <main class="wrap" id="app" aria-live="polite">
    <div class="stack" aria-hidden="true"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  </main>
  <noscript><p class="wrap">Для расписания нужен включённый JavaScript.</p></noscript>
  <script type="module">
    import { createGroupView } from './src/view.js';
    import { moscowNow, parseNowOverride } from './src/time.js';

    const view = createGroupView({ top: document.getElementById('top'), app: document.getElementById('app') });

    // Шаг 2: данные из файлов. На шаге 3 их заменит загрузка из Google Таблицы.
    async function loadData() {
      const [seed, demo] = await Promise.all(['data/seed.json', 'data/demo-entries.json'].map(async (url) => {
        const res = await fetch(url);
        if (!res.ok) throw new Error(url + ': ' + res.status);
        return res.json();
      }));
      return { ...seed, ...demo };
    }

    const override = parseNowOverride(location.search);
    const tick = () => view.show({ now: override || moscowNow(), nowMs: Date.now() });

    loadData()
      .then((data) => { view.show({ data, now: override || moscowNow(), nowMs: Date.now() }); setInterval(tick, 60 * 1000); })
      .catch(() => {
        document.getElementById('app').replaceChildren(Object.assign(document.createElement('div'), { className: 'empty', textContent: 'Не удалось загрузить расписание. Проверьте интернет и обновите страницу.' }));
      });
  </script>
</body>
</html>
