<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Расписание 322</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="top"></div>
  <main class="wrap" id="app" aria-live="polite">
    <div class="stack" aria-hidden="true"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  </main>
  <noscript><p class="wrap">Для расписания нужен включённый JavaScript.</p></noscript>
  <script type="module">
    import { createGroupView } from './src/view.js';
    import { moscowNow, parseNowOverride } from './src/time.js';
    import { loadSchedule } from './src/api.js';
    import { API_URL } from './src/config.js';

    const app = document.getElementById('app');
    const view = createGroupView({ top: document.getElementById('top'), app });
    const override = parseNowOverride(location.search);
    const clock = () => ({ now: override || moscowNow(), nowMs: Date.now() });

    const savedLabel = (ms) => new Intl.DateTimeFormat('ru-RU', { timeZone: 'Europe/Moscow', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }).format(ms);

    function showError() {
      const retry = Object.assign(document.createElement('button'), { type: 'button', className: 'btn btn-secondary', textContent: 'Повторить' });
      retry.addEventListener('click', refresh);
      const box = Object.assign(document.createElement('div'), { className: 'empty' });
      box.append(Object.assign(document.createElement('b'), { textContent: 'Не удалось загрузить расписание' }),
        Object.assign(document.createElement('span'), { className: 'muted', textContent: 'Проверьте интернет и нажмите «Повторить».' }), retry);
      app.replaceChildren(box);
    }

    // Локально (API_URL пустой) — данные из файлов в site/data.
    async function localFetch() {
      const [seed, demo] = await Promise.all(['data/seed.json', 'data/demo-entries.json'].map((u) => fetch(u).then((r) => r.json())));
      return { ok: true, status: 200, json: async () => ({ ...seed, ...demo }) };
    }

    function refresh() {
      return loadSchedule({
        apiUrl: API_URL,
        fetchFn: API_URL ? fetch.bind(window) : localFetch,
        storage: API_URL ? window.localStorage : null,
        onData: (data) => view.show({ data, notice: '', ...clock() }),
        onStatus: (status, info) => {
          if (status === 'offline') view.show({ notice: `Нет связи с сервером. Показано сохранённое от ${savedLabel(info.savedAt)}.`, ...clock() });
          else showError();
        },
      });
    }

    refresh();
    setInterval(() => view.show(clock()), 60 * 1000);   // «идёт сейчас» обновляется каждую минуту
    setInterval(refresh, 5 * 60 * 1000);                // свежие данные — раз в 5 минут
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  </script>
</body>
</html>
