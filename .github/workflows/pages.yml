# Выкладка сайта (папка site/) на GitHub Pages при каждом изменении ветки main.
# Сначала прогоняются проверки логики (node --test): если что-то сломано, сайт не обновится.
name: Сайт на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # ручной запуск со страницы Actions

permissions:
  contents: read
  pages: write              # выкладывать на Pages
  id-token: write           # подтверждать, что выкладка идёт из этого репозитория

concurrency:                # одна выкладка за раз
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Проверки логики
        run: node --version && node --test
      - name: Собрать сайт для Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Выложить на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
