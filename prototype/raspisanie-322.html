<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Расписание 322</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Концепция: «журнал группы» — разлинованная бумага официального расписания, чернила и штампы.
   Предмет = цветная плитка с сокращением; статусы переносов и отмен — штампами; верх/низ недели — половинка клетки. */
:root{
  --paper:#f2f4f5;--surface:#ffffff;--ink:#15181d;--ink-2:#525b68;--grid:rgb(21 24 29 / .045);--line:#e2e5e9;
  --accent:#2a3aa8;--on-accent:#ffffff;--accent-weak:#e6e8f8;--input-border:#7b8492;--focus:#2a3aa8;
  --stamp-move:#2a3aa8;--stamp-cancel:#b3261e;--ok:#1b7a35;--warn-bg:#fff1cc;--warn-text:#6b4300;--now:#fff6d6;--scrim:rgb(10 12 16 / .45);
  --s-mun-bg:#d9f2ee;--s-mun:#0b5c52;--s-gpp-bg:#dde7fb;--s-gpp:#1f4aa8;--s-upp-bg:#f6e2d9;--s-upp:#8a3412;--s-up-bg:#f9dde2;--s-up:#9b1c36;
  --s-gp-bg:#e0f2dc;--s-gp:#2b6a1f;--s-tp-bg:#fbecc9;--s-tp:#7a4d00;--s-osd-bg:#ebe2fb;--s-osd:#5a2fb0;--s-mp-bg:#d8eff8;--s-mp:#0d5f80;--s-fk-bg:#e6e8eb;--s-fk:#3f4752;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;--f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --fs-xs:.75rem;--fs-s:.875rem;--fs-m:1rem;--fs-l:1.25rem;--fs-xl:1.75rem;
  --sp-1:4px;--sp-2:8px;--sp-3:16px;--sp-4:24px;--sp-5:32px;--r:14px;--tap:44px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1215;--surface:#181c21;--ink:#e8eaed;--ink-2:#a2aab5;--grid:rgb(232 234 237 / .035);--line:#2a3038;
  --accent:#a3adff;--on-accent:#10163d;--accent-weak:#232a4d;--input-border:#717a87;--focus:#a3adff;
  --stamp-move:#a3adff;--stamp-cancel:#ff8b80;--ok:#6fd08b;--warn-bg:#3a2d0c;--warn-text:#ffd27a;--now:#2b2714;--scrim:rgb(0 0 0 / .6);
  --s-mun-bg:#12332f;--s-mun:#7fe0d2;--s-gpp-bg:#172742;--s-gpp:#9dbcff;--s-upp-bg:#3a2219;--s-upp:#f5a882;--s-up-bg:#3c1a22;--s-up:#ff9aae;
  --s-gp-bg:#18301a;--s-gp:#93db85;--s-tp-bg:#3a2c10;--s-tp:#ffcd6b;--s-osd-bg:#2a1f45;--s-osd:#c4a8ff;--s-mp-bg:#10303d;--s-mp:#84d3f2;--s-fk-bg:#262b31;--s-fk:#c3c9d1;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1215;--surface:#181c21;--ink:#e8eaed;--ink-2:#a2aab5;--grid:rgb(232 234 237 / .035);--line:#2a3038;
  --accent:#a3adff;--on-accent:#10163d;--accent-weak:#232a4d;--input-border:#717a87;--focus:#a3adff;
  --stamp-move:#a3adff;--stamp-cancel:#ff8b80;--ok:#6fd08b;--warn-bg:#3a2d0c;--warn-text:#ffd27a;--now:#2b2714;--scrim:rgb(0 0 0 / .6);
  --s-mun-bg:#12332f;--s-mun:#7fe0d2;--s-gpp-bg:#172742;--s-gpp:#9dbcff;--s-upp-bg:#3a2219;--s-upp:#f5a882;--s-up-bg:#3c1a22;--s-up:#ff9aae;
  --s-gp-bg:#18301a;--s-gp:#93db85;--s-tp-bg:#3a2c10;--s-tp:#ffcd6b;--s-osd-bg:#2a1f45;--s-osd:#c4a8ff;--s-mp-bg:#10303d;--s-mp:#84d3f2;--s-fk-bg:#262b31;--s-fk:#c3c9d1;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:150px}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--f-body);font-size:var(--fs-m);line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--paper)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:var(--sp-3) 132px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
.display{font-family:var(--f-display);letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}.small{font-size:var(--fs-s)}.xs{font-size:var(--fs-xs)}
.stack{display:flex;flex-direction:column;gap:var(--sp-3)}
.row{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center}
.grow{flex:1;min-width:0}
.caps{text-transform:uppercase;letter-spacing:.08em;font-size:var(--fs-xs);font-weight:700}

/* полоса прототипа */
.proto{background:var(--surface);border-bottom:1px solid var(--line)}
.proto .wrap{padding-block:6px;display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{min-height:36px;border:0;background:transparent;color:var(--ink);padding:0 14px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* кнопки */
button{font:inherit;color:inherit}
.btn{min-height:var(--tap);padding:0 var(--sp-3);border-radius:var(--r);border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;transition:background-color .15s,transform .1s}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-secondary{background:var(--accent-weak);color:var(--accent)}
.btn-ghost{background:transparent;color:var(--accent)}
.btn-danger{background:transparent;color:var(--stamp-cancel);border-color:var(--stamp-cancel)}
.btn-big{min-height:56px;font-size:var(--fs-m)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
@media (hover:hover){.btn-primary:hover{background:color-mix(in srgb,var(--accent) 86%,var(--ink))}.btn-secondary:hover,.btn-ghost:hover{background:color-mix(in srgb,var(--accent-weak) 75%,var(--accent))}}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.w100{width:100%}
.icon-btn{min-width:var(--tap);min-height:var(--tap);border:0;background:transparent;color:var(--ink-2);cursor:pointer;border-radius:var(--r);display:inline-grid;place-items:center}
@media (hover:hover){.icon-btn:hover{background:var(--accent-weak);color:var(--accent)}}
.icon-btn svg,.btn svg{width:20px;height:20px}
.chip{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;font-size:var(--fs-s);font-weight:500}
@media (hover:hover){.chip:hover{border-color:var(--accent);color:var(--accent)}}
.chips{display:flex;gap:var(--sp-2);overflow-x:auto;padding-bottom:4px;scrollbar-width:none}

/* поля */
.lbl{display:block;font-weight:600;margin-bottom:var(--sp-1);font-size:var(--fs-s)}
.input{width:100%;min-height:var(--tap);padding:10px 12px;border:1px solid var(--input-border);border-radius:var(--r);background:var(--surface);color:var(--ink);font:inherit;font-size:var(--fs-m);outline:2px solid transparent;outline-offset:-3px}
.input:focus-visible{outline-color:var(--focus)}
textarea.input{resize:vertical;min-height:76px}
.err{color:var(--stamp-cancel);font-size:var(--fs-s);margin-top:var(--sp-1)}
.err:empty{display:none}
.check{display:flex;align-items:center;gap:10px;min-height:var(--tap);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* плитка предмета */
.tile{display:inline-grid;place-items:center;min-width:46px;height:32px;padding:0 6px;border-radius:8px;font-family:var(--f-display);font-size:.72rem;font-weight:700;letter-spacing:.02em;background:var(--t-bg,var(--s-fk-bg));color:var(--t,var(--s-fk))}
.tile.lg{min-width:58px;height:40px;font-size:.85rem;border-radius:10px}
.t-mun{--t-bg:var(--s-mun-bg);--t:var(--s-mun)}.t-gpp{--t-bg:var(--s-gpp-bg);--t:var(--s-gpp)}.t-upp{--t-bg:var(--s-upp-bg);--t:var(--s-upp)}.t-up{--t-bg:var(--s-up-bg);--t:var(--s-up)}
.t-gp{--t-bg:var(--s-gp-bg);--t:var(--s-gp)}.t-tp{--t-bg:var(--s-tp-bg);--t:var(--s-tp)}.t-osd{--t-bg:var(--s-osd-bg);--t:var(--s-osd)}.t-mp{--t-bg:var(--s-mp-bg);--t:var(--s-mp)}.t-fk{--t-bg:var(--s-fk-bg);--t:var(--s-fk)}
/* половинка клетки: верх/низ недели */
.half{display:inline-flex;align-items:center;gap:6px}
.half svg{width:14px;height:14px}

/* шапка редактора */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:var(--sp-2)}
.weekline{display:flex;align-items:center;gap:var(--sp-1)}
.weekline .t{flex:1;text-align:center;min-width:0}
.weekline h1{font-size:1.15rem}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:var(--sp-2)}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:52px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px}
.days button .d{font-family:var(--f-display);font-size:.7rem;font-weight:700}
.days button .n{font-family:var(--f-mono);font-size:.95rem;font-weight:700}
.days button .dot{width:8px;height:8px;border-radius:50%;border:2px solid var(--ink-2)}
.days button .dot.full{background:var(--ok);border-color:var(--ok)}
.days button .dot.none{border-color:transparent}
.days button[aria-current="date"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.days button:disabled{opacity:.4}

/* карточка «Заполнить» */
.fill{background:var(--ink);color:var(--surface);border-radius:18px;padding:var(--sp-3);display:grid;grid-template-columns:1fr auto;gap:var(--sp-2) var(--sp-3);align-items:center}
.fill h2{font-family:var(--f-display);font-size:1.05rem}
.fill .meter{grid-column:1/-1;display:flex;gap:4px}
.fill .meter i{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--surface) 25%,transparent)}
.fill .meter i.on{background:var(--ok)}
.fill .btn{background:var(--surface);color:var(--ink)}
.fill.done{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.fill.done .btn{background:var(--accent-weak);color:var(--accent)}

/* день */
.day{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.day-head{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-3)}
.day-head .dn{font-family:var(--f-display);font-size:1.5rem;font-weight:700;line-height:1}
.day-head .dd{display:flex;flex-direction:column;line-height:1.2}
.notes{display:flex;flex-wrap:wrap;gap:6px;padding:0 var(--sp-3) var(--sp-2)}
.note{font-size:var(--fs-s);background:var(--warn-bg);color:var(--warn-text);border-radius:8px;padding:4px 10px;border:0;cursor:pointer;min-height:32px;font-weight:600}
.prow{position:relative;width:100%;display:grid;grid-template-columns:3.4rem auto 1fr auto;gap:0 12px;align-items:center;text-align:left;background:transparent;border:0;border-top:1px dashed var(--line);padding:12px var(--sp-3) 12px 12px;cursor:pointer;min-height:64px}
@media (hover:hover){.prow:hover{background:color-mix(in srgb,var(--accent-weak) 55%,transparent)}}
.prow:focus-visible{outline-offset:-3px}
.prow .tm{font-family:var(--f-mono);font-size:.85rem;line-height:1.2;text-align:right;color:var(--ink)}
.prow .tm span{display:block;color:var(--ink-2);font-size:.75rem}
.prow .mid{min-width:0;display:flex;flex-direction:column;gap:2px}
.prow .subj{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .meta{font-size:var(--fs-s);color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.prow .meta .room{font-family:var(--f-mono);font-weight:700;color:var(--ink)}
.prow .st{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:var(--fs-xs);text-align:right}
.st .ok{color:var(--ok);font-weight:700}.st .need{color:var(--ink-2);font-weight:600}.st .who{color:var(--ink-2)}
.pill{font-size:var(--fs-xs);font-weight:700;border-radius:6px;padding:1px 6px;background:var(--accent-weak);color:var(--accent)}
.pill.warn{background:var(--warn-bg);color:var(--warn-text)}
.dim .tm,.dim .subj,.dim .room{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ink-2)}
.dim .tile{opacity:.55}
.prow.dim{padding-right:118px}
.stamp{position:absolute;right:14px;top:50%;transform:translateY(-50%) rotate(-5deg);border:2px solid currentColor;border-radius:6px;padding:2px 8px;font-family:var(--f-display);font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.3;text-align:center;background:color-mix(in srgb,var(--surface) 80%,transparent)}
.stamp.move{color:var(--stamp-move)}.stamp.cancel{color:var(--stamp-cancel)}
.lect{width:100%;text-align:left;border:0;border-top:1px dashed var(--line);background:transparent;color:var(--ink-2);padding:12px var(--sp-3);cursor:pointer;min-height:var(--tap);font-size:var(--fs-s)}

/* нижняя панель */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.bar .inner{max-width:640px;margin:0 auto;padding:6px max(16px,env(safe-area-inset-right,0px)) var(--sp-2) max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
.save{grid-column:1/-1;font-size:var(--fs-xs);font-weight:600;display:flex;align-items:center;gap:6px}
.save::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.save.saved{color:var(--ok)}.save.saving,.save.idle{color:var(--ink-2)}.save.offline{color:var(--warn-text)}.save.error{color:var(--stamp-cancel)}

/* лист */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s;z-index:30}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;z-index:31;transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);padding:var(--sp-2) max(16px,env(safe-area-inset-right,0px)) calc(var(--sp-4) + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet.open{transform:translateY(0)}
.sheet.full{height:92dvh}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto var(--sp-3)}
.sh-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:var(--sp-3)}
.sh-head h2{font-size:var(--fs-l)}
.sec{display:flex;flex-direction:column;gap:var(--sp-2);padding-top:var(--sp-3);margin-top:var(--sp-3);border-top:1px dashed var(--line)}
.links{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.links li{display:flex;align-items:center;gap:var(--sp-2);background:var(--paper);border-radius:10px;padding:4px 4px 4px 12px;min-width:0}
.links li a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--accent);font-family:var(--f-mono);font-size:.8rem}
.warnbox{background:var(--warn-bg);color:var(--warn-text);border-radius:12px;padding:10px 12px;font-size:var(--fs-s);display:flex;flex-direction:column;gap:8px}
.prev{border:1px dashed var(--input-border);border-radius:12px;padding:10px 12px;font-size:var(--fs-s);display:flex;flex-direction:column;gap:4px}
.prev .u{font-family:var(--f-mono);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.grid-times{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid-times button{min-height:var(--tap);border-radius:10px;border:1px solid var(--input-border);background:var(--surface);cursor:pointer;font-family:var(--f-mono);font-size:.9rem}
.grid-times button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.radio{display:flex;flex-direction:column;gap:4px}
.radio label{display:flex;gap:10px;align-items:center;min-height:var(--tap);cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:0 12px}
.radio input{width:20px;height:20px;accent-color:var(--accent)}
.ba{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--sp-2);align-items:center}
.ba>div{border:1px solid var(--line);border-radius:12px;padding:10px;font-size:var(--fs-s)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
pre.tg{white-space:pre-wrap;word-break:break-word;background:var(--paper);border-radius:12px;padding:12px;font-family:var(--f-body);font-size:var(--fs-s);margin:0;max-height:38dvh;overflow:auto}
.tabs{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.tabs button{flex:1;min-height:40px;border:0;background:transparent;border-radius:9px;cursor:pointer;font-weight:600;font-size:var(--fs-s)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}

/* мастер заполнения */
.steps{display:flex;gap:4px;margin-bottom:var(--sp-3)}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.done{background:var(--ok)}.steps i.cur{background:var(--ink)}
.wz-card{display:flex;gap:12px;align-items:center;margin-bottom:var(--sp-2)}
.wz-foot{position:sticky;bottom:calc(-1 * (var(--sp-4) + env(safe-area-inset-bottom,0px)));background:var(--surface);padding:var(--sp-3) 0 calc(var(--sp-3) + env(safe-area-inset-bottom,0px));margin-top:var(--sp-3);display:grid;grid-template-columns:1fr 2fr;gap:var(--sp-2);border-top:1px solid var(--line)}
.big-check{width:72px;height:72px;border-radius:50%;background:var(--ok);color:var(--surface);display:grid;place-items:center;margin:var(--sp-4) auto var(--sp-2)}
.big-check svg{width:36px;height:36px}

/* тост, диалог */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);background:var(--ink);color:var(--surface);border-radius:12px;padding:8px 8px 8px 14px;display:flex;gap:var(--sp-2);align-items:center;z-index:40;max-width:calc(100% - 32px);font-size:var(--fs-s);box-shadow:0 8px 24px rgb(0 0 0 / .18)}
.toast button{background:transparent;border:0;color:var(--surface);font-weight:700;text-decoration:underline;min-height:36px;cursor:pointer;padding:0 8px}
.dialog{position:fixed;inset:0;display:grid;place-items:center;z-index:50;padding:16px}
.dialog .box{background:var(--surface);border-radius:20px;padding:var(--sp-4);max-width:520px;width:100%;display:flex;flex-direction:column;gap:var(--sp-3)}

/* экран группы */
.g-head{display:flex;align-items:flex-end;gap:var(--sp-3);flex-wrap:wrap}
.g-head .big{font-family:var(--f-display);font-size:2.6rem;font-weight:700;line-height:.95}

/* ===== экран группы ===== */
function demoNow(){return{real:moscowNow(),tue:{date:'2026-11-03',min:14*60},thu:{date:'2026-11-05',min:19*60},sun:{date:'2026-11-01',min:12*60}}[UI.gDemo]}
function nextStudyDay(d){let x=add(d,1);for(let i=0;i<14;i++){if(dow(x)!==0&&buildDay(x).pairs.some(isActive))return x;x=add(x,1)}return add(d,1)}
function renderGroup(){
  $('bar').hidden=true;
  const now=demoNow();const today=now.date;
  const autoTab=(now.min>=18*60+30||dow(today)===0)?'tomorrow':'today';const tab=UI.gTab||autoTab;
  const tomorrow=nextStudyDay(dow(today)===0?add(today,-1):today);
  $('top').replaceChildren(h('div',{class:'top'},h('div',{class:'wrap'},
    h('div',{class:'row',style:'margin-bottom:8px'},h('label',{class:'xs muted',for:'demo',text:'Демо-время'}),
      h('select',{class:'input',id:'demo',name:'demo',style:'width:auto;min-height:36px;padding:4px 8px;font-size:.875rem',onchange:e=>{UI.gDemo=e.target.value;UI.gTab=null;render()}},
        [['real','сейчас (Москва)'],['tue','вт 3 ноября, 14:00'],['thu','чт 5 ноября, 19:00'],['sun','вс 1 ноября, 12:00']].map(([v,l])=>h('option',{value:v,selected:UI.gDemo===v,text:l})))),
    h('div',{class:'tabs',role:'tablist','aria-label':'Вид'},[['today','Сегодня'],['tomorrow','Завтра'],['week','Неделя'],['hw','ДЗ']].map(([k,l])=>h('button',{type:'button',role:'tab','aria-selected':String(tab===k),onclick:()=>{UI.gTab=k;render();scrollTo(0,0)},text:l}))))));
  const out=[];
  if(tab==='week'){
    const mon=UI.gWeek||monday(dow(today)===0?add(today,1):today);
    out.push(h('div',{class:'weekline'},h('button',{type:'button',class:'icon-btn','aria-label':'Предыдущая неделя',onclick:()=>{UI.gWeek=add(mon,-7);renderMain()}},I.prev()),
      h('div',{class:'t'},h('h1',{class:'display',style:'font-size:1.15rem',text:Dt(mon).getUTCDate()+' — '+fmtDM(add(mon,5))}),h('div',{class:'xs muted'},halfLabel(halfOf(mon)))),
      h('button',{type:'button',class:'icon-btn','aria-label':'Следующая неделя',onclick:()=>{UI.gWeek=add(mon,7);renderMain()}},I.next())));
    for(const d of weekDates(mon)){const day=buildDay(d);if(!day.pairs.length&&!day.notes.length)continue;
      out.push(h('section',{class:'stack',style:'gap:10px'},h('h2',{class:'display',style:'font-size:1rem',text:DOW[dow(d)].toUpperCase()+' · '+fmtDM(d)}),
        day.notes.length?h('div',{class:'notes',style:'padding:0'},day.notes.map(n=>h('span',{class:'note',text:n}))):null,h('div',{class:'tl'},day.pairs.map(p=>gCard(p,null)))))}
  }else if(tab==='hw'){
    const mon=monday(dow(today)===0?add(today,1):today);
    const ds=[...weekDates(mon),...weekDates(add(mon,7))].filter(d=>d>=today);
    const groups=ds.map(d=>({d,items:buildDay(d).pairs.filter(p=>isActive(p)&&hasHW(p))})).filter(g=>g.items.length);
    out.push(h('div',{},h('h1',{class:'display',style:'font-size:1.6rem',text:'Что готовить'}),h('div',{class:'small muted',text:'ДЗ на ближайшие дни, по порядку'})));
    if(!groups.length)out.push(h('div',{class:'empty'},h('b',{text:'ДЗ пока не вписано'}),h('span',{class:'small muted',text:'Активисты обычно заполняют неделю на выходных.'})));
    out.push(h('div',{class:'hwlist'},groups.map(g=>h('div',{class:'hwday'},h('h3',{text:'К '+(['воскресенью','понедельнику','вторнику','среде','четвергу','пятнице','субботе'][dow(g.d)])+', '+fmtDM(g.d)}),
      h('div',{class:'stack',style:'gap:8px'},g.items.map(p=>h('div',{class:'hwitem'},tile(p.subj),h('div',{class:'b'},h('b',{text:fullName(p.subj)+' · '+hm(p.start)}),p.hw?h('span',{style:'white-space:pre-wrap',text:p.hw}):null,p.links.map(linkEl)))))))));
  }else{
    const date=tab==='today'?today:tomorrow;const day=buildDay(date);
    out.push(h('div',{class:'g-head'},h('div',{class:'big'},DOWS[dow(date)].toUpperCase()+' '+Dt(date).getUTCDate(),h('small',{text:MON[Dt(date).getUTCMonth()]+' · '+(tab==='today'?'сегодня':'завтра')})),h('div',{class:'xs muted',style:'padding-bottom:4px'},halfLabel(day.half))));
    if(tab==='today'&&day.pairs.some(isActive)){
      const act=day.pairs.filter(isActive);const cur=act.find(p=>toMin(p.start)<=now.min&&now.min<toMin(p.end));const nx=act.find(p=>toMin(p.start)>now.min);
      if(cur){const total=toMin(cur.end)-toMin(cur.start),gone=now.min-toMin(cur.start);
        out.push(h('div',{class:'nowcard'},h('div',{class:'row'},h('span',{class:'caps',text:'Идёт сейчас · ещё '+(total-gone)+' мин'}),h('span',{class:'room',text:cur.room})),h('b',{text:fullName(cur.subj)}),h('div',{class:'track'},h('i',{style:'transform:scaleX('+(gone/total)+')'}))))}
      else if(nx)out.push(h('div',{class:'nowcard'},h('div',{class:'row'},h('span',{class:'caps',text:'Следующая · через '+(toMin(nx.start)-now.min)+' мин'}),h('span',{class:'room',text:nx.room})),h('b',{text:fullName(nx.subj)+' · '+hm(nx.start)})));
    }
    if(day.notes.length)out.push(h('div',{class:'notes',style:'padding:0'},day.notes.map(n=>h('span',{class:'note',text:n}))));
    if(!day.pairs.length){const nd=nextStudyDay(date);const f=buildDay(nd).pairs.find(isActive);
      out.push(h('div',{class:'empty'},h('b',{text:(tab==='today'?'Сегодня':'В этот день')+' пар нет'}),f?h('span',{class:'muted',text:'Ближайшая: '+fmtShort(nd)+', '+hm(f.start)+' — '+fullName(f.subj)+', ауд. '+f.room}):null,
        h('button',{type:'button',class:'btn btn-secondary',onclick:()=>{UI.gTab='week';UI.gWeek=monday(nd);render()},text:'Показать неделю'})))}
    else out.push(h('div',{class:'tl'},day.pairs.map(p=>gCard(p,tab==='today'?now:null))));
  }
  $('app').replaceChildren(h('div',{class:'stack'},out));
}
function gCard(p,now){
  const isNow=now&&isActive(p)&&toMin(p.start)<=now.min&&now.min<toMin(p.end);
  const c=h('article',{class:'gc'+(isActive(p)?'':' dim')+(isNow?' now':'')});
  c.append(h('span',{class:'when'},hm(p.start),h('span',{text:hm(p.end)})),
    h('div',{class:'top-line'},tile(p.subj),h('span',{class:'name',text:fullName(p.subj)})),h('span',{class:'room'},h('small',{text:'ауд.'}),p.room),
    h('span',{class:'sub',text:(p.nums.length?p.nums.join('–')+' пара · ':'')+p.type+(p.teacher?' · '+p.teacher:'')}));
  const info=h('div',{class:'hw'});
  if(p.movedTo)info.append(h('b',{text:'Перенесена на '+dmw(p.movedTo.date)+', '+hm(p.movedTo.start)+', ауд. '+p.movedTo.room}));
  if(p.cancelled)info.append(h('b',{style:'color:var(--stamp-cancel)',text:'Отменена'+(p.reason?': '+p.reason:'')}));
  if(p.kind==='moved')info.append(h('span',{class:'pill',style:'align-self:flex-start',text:'перенос с '+fmtDM(p.srcDate)}));
  if(p.kind==='extra')info.append(h('span',{class:'pill',style:'align-self:flex-start',text:'доп. пара'}));
  if(p.orig.room)info.append(h('span',{text:'Аудитория изменена, было '+p.orig.room}));
  if(p.note)info.append(h('span',{class:'muted',text:p.note}));
  if(isActive(p)){if(p.hw)info.append(h('span',{style:'white-space:pre-wrap',text:p.hw}));p.links.forEach(u=>info.append(linkEl(u)));if(p.noHW&&!hasHW(p))info.append(h('span',{class:'muted',text:'ДЗ нет'}))}
  if(p.at&&Date.now()-p.at.ts<48*3600e3)info.append(h('span',{class:'changed',text:'изменено '+fmtStamp(p.at)}));
  if(info.childNodes.length)c.append(info);
  if(p.movedTo)c.append(h('span',{class:'stamp move','aria-hidden':'true',text:'Перенесено'}));
  if(p.cancelled)c.append(h('span',{class:'stamp cancel','aria-hidden':'true',text:'Отменено'}));
  return c;
}

/* ===== режимы ===== */
function setMode(m){UI.mode=m;$('m-act').setAttribute('aria-pressed',String(m==='act'));$('m-grp').setAttribute('aria-pressed',String(m==='grp'));if(sheetBuild)closeSheet();render();scrollTo(0,0)}
$('m-act').onclick=()=>setMode('act');$('m-grp').onclick=()=>setMode('grp');
function renderMain(){if(UI.mode==='grp')renderGroup();else if(!UI.user)renderLogin();else renderEditor()}
function render(){renderMain();renderBar()}
render();

</script>
